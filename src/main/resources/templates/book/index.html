<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{shared/layout :: layout(content=~{::content}, pageTitle='Books')}">
<head>
    <title>Books</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📚 Book Library</h2>
        <a href="/app/books/new" class="btn btn-primary">
            ➕ Add New Book
        </a>
    </div>

    <!-- Search form -->
    <form th:action="@{/app/books}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" class="form-control" name="search"
                   th:value="${search}" placeholder="Search by title or author...">
            <button type="submit" class="btn btn-outline-secondary">🔍 Search</button>
            <a th:if="${search}" href="/app/books" class="btn btn-outline-danger">Clear</a>
        </div>
    </form>

    <!-- Books table -->
    <div class="card">
        <div class="card-body">
            <div th:if="${books.isEmpty()}" class="text-center text-muted py-5">
                <p class="mb-0">No books found. Add your first book!</p>
            </div>

            <table th:if="${!books.isEmpty()}" class="table table-hover">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>ISBN</th>
                    <th>Genre</th>
                    <th>Author</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.title}">Book Title</td>
                    <td th:text="${book.isbn}">1234567890</td>
                    <td>
                        <span class="badge bg-info" th:text="${book.genre}">Genre</span>
                    </td>
                    <td th:text="${book.author.name}">Author Name</td>
                    <td>
                        <!-- Edit button -->
                        <a th:href="@{/app/books/edit/{id}(id=${book.id})}"
                           class="btn btn-sm btn-warning">
                            ✏️ Edit
                        </a>

                        <!-- Delete button - only ADMIN -->
                        <form th:action="@{/app/books/delete/{id}(id=${book.id})}"
                              method="post" class="d-inline"
                              sec:authorize="hasRole('ADMIN')"
                              onsubmit="return confirm('Are you sure?');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                🗑️ Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3 text-muted">
        <small>Total books: <strong th:text="${books.size()}">0</strong></small>
    </div>
</div>
</body>
</html>
