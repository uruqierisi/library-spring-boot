<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{shared/layout :: layout(content=~{::content}, pageTitle=${book.id != null ? 'Edit Book' : 'New Book'})}">
<head>
    <title>Book Form</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 th:text="${book.id != null ? '✏️ Edit Book' : '➕ Add New Book'}">Book Form</h3>
                </div>
                <div class="card-body">
                    <!-- Form submits to different URLs based on create/edit -->
                    <form th:action="${book.id != null ? '/app/books/' + book.id : '/app/books'}"
                          method="post" th:object="${book}">

                        <!-- Title field -->
                        <div class="mb-3">
                            <label for="title" class="form-label">Title *</label>
                            <input type="text" class="form-control" id="title"
                                   th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}">Title error</div>
                        </div>

                        <!-- ISBN field with real-time validation -->
                        <div class="mb-3">
                            <label for="isbn" class="form-label">ISBN *</label>
                            <input type="text" class="form-control" id="isbn"
                                   th:field="*{isbn}"
                                   th:classappend="${#fields.hasErrors('isbn')} ? 'is-invalid' : ''"
                                   th:data-book-id="${book.id}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('isbn')}"
                                 th:errors="*{isbn}">ISBN error</div>
                            <!-- Real-time validation message from AJAX -->
                            <div id="isbn-feedback" class="form-text"></div>
                        </div>

                        <!-- Genre field -->
                        <div class="mb-3">
                            <label for="genre" class="form-label">Genre *</label>
                            <input type="text" class="form-control" id="genre"
                                   th:field="*{genre}"
                                   th:classappend="${#fields.hasErrors('genre')} ? 'is-invalid' : ''"
                                   placeholder="e.g., Fiction, Science, History">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('genre')}"
                                 th:errors="*{genre}">Genre error</div>
                        </div>

                        <!-- Author dropdown -->
                        <div class="mb-3">
                            <label for="author" class="form-label">Author *</label>
                            <select class="form-select" id="author" th:field="*{author}"
                                    th:classappend="${#fields.hasErrors('author')} ? 'is-invalid' : ''">
                                <option value="">-- Select Author --</option>
                                <option th:each="author : ${authors}"
                                        th:value="${author.id}"
                                        th:text="${author.name}">Author Name</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('author')}"
                                 th:errors="*{author}">Author error</div>

                            <!-- Quick link to add new author -->
                            <small class="form-text text-muted" sec:authorize="hasRole('ADMIN')">
                                Author not in list?
                                <a href="/app/authors/new" target="_blank" class="text-primary">Add new author</a>
                            </small>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="/app/books" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${book.id != null ? 'Update Book' : 'Create Book'}">Submit</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript for real-time ISBN validation using REST API -->
<script th:inline="javascript">
    // Get the ISBN input field
    const isbnInput = document.getElementById('isbn');
    const isbnFeedback = document.getElementById('isbn-feedback');
    const bookId = isbnInput.dataset.bookId || null;

    // Add event listener for when user types in ISBN field
    isbnInput.addEventListener('blur', async function() {
        const isbn = this.value.trim();

        // Clear previous feedback
        isbnFeedback.textContent = '';
        isbnFeedback.className = 'form-text';

        if (isbn.length === 0) {
            return; // Don't check empty ISBN
        }

        try {
            // Call our REST API endpoint
            const url = `/api/books/check-isbn?isbn=${encodeURIComponent(isbn)}` +
                (bookId ? `&bookId=${bookId}` : '');

            const response = await fetch(url);
            const data = await response.json();

            // Show feedback based on response
            if (data.exists) {
                isbnFeedback.textContent = '⚠️ This ISBN already exists in the system';
                isbnFeedback.className = 'form-text text-danger';
            } else {
                isbnFeedback.textContent = '✓ ISBN is available';
                isbnFeedback.className = 'form-text text-success';
            }
        } catch (error) {
            console.error('Error checking ISBN:', error);
        }
    });
</script>
</body>
</html>
