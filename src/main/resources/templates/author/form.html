<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{shared/layout :: layout(content=~{::content}, pageTitle=${author?.id != null ? 'Edit Author' : 'New Author'})}">
<head>
    <title>Author Form</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>
    <i th:if="${author.id != null}" class="bi bi-pencil"></i>
    <i th:if="${author.id == null}" class="bi bi-plus-circle"></i>
    <span th:text="${author.id != null ? 'Edit Author' : 'Add New Author'}">Author Form</span>
</h3>
                </div>
                <div class="card-body">
                    <form th:action="${author.id != null ? '/app/authors/' + author.id : '/app/authors'}"
                          method="post"
                          th:object="${author}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Author Name *</label>
                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="e.g., J.K. Rowling">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">Name error</div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="/app/authors" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${author.id != null ? 'Update Author' : 'Create Author'}">Submit</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
